# Keeps the GitHub Actions used in the workflows up to date. Actions are pinned to commit
# SHAs, and Dependabot proposes the new SHA, with its version in a comment, as a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
