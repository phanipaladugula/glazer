name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Check formatting
        run: Scripts/format.sh --check

      - name: Test
        run: Scripts/test.sh

      - name: Bundle
        run: Scripts/bundle.sh

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Glazer.app
          path: dist/Glazer.app
          retention-days: 7
