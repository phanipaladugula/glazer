name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Check formatting
        run: Scripts/format.sh --check

      - name: Check shell scripts
        run: for script in install.sh Scripts/*.sh; do bash -n "$script"; done

      - name: Test
        run: Scripts/test.sh

      - name: Bundle
        run: Scripts/bundle.sh

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Glazer.app
          path: dist/Glazer.app
          retention-days: 7
