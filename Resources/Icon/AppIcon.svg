<?xml version="1.0" encoding="UTF-8"?>
<!--
  Glazer app icon: "Focus hop".

  A MacBook and a monitor. Focus has just hopped from the MacBook to the monitor along a
  glowing arc, so the monitor is lit and its window holds the focus ring.

  The tile follows the macOS icon grid: an 824 pt rounded square on a 1024 pt canvas.
  Scripts/icon.sh renders this file into Resources/Glazer.icns and docs/images/icon.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3F86"/>
      <stop offset=".55" stop-color="#16225A"/>
      <stop offset="1" stop-color="#0A1131"/>
    </linearGradient>
    <radialGradient id="tileLight" cx=".5" cy=".15" r=".8">
      <stop offset="0" stop-color="#6E8CFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6E8CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Screens -->
    <linearGradient id="litScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset=".45" stop-color="#5CC8FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="dimScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3D73"/>
      <stop offset="1" stop-color="#1A2552"/>
    </linearGradient>

    <!-- Aluminium -->
    <linearGradient id="aluminium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEF6"/>
      <stop offset="1" stop-color="#9AA6BC"/>
    </linearGradient>
    <linearGradient id="aluminiumShaded" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C3D4"/>
      <stop offset="1" stop-color="#6B778F"/>
    </linearGradient>

    <!-- Focus arc: fades in from the MacBook, brightest where it reaches the monitor -->
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset=".55" stop-color="#7DD3FC" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E0F7FF"/>
    </linearGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="deviceShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030820" flood-opacity=".55"/>
    </filter>
    <filter id="screenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tileLight)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/>

  <g transform="translate(0 44)">
    <!-- MacBook, left, not in focus -->
    <g filter="url(#deviceShadow)">
      <rect x="196" y="452" width="258" height="174" rx="16" fill="#0E1638" stroke="url(#aluminiumShaded)" stroke-width="8"/>
      <rect x="214" y="470" width="222" height="138" rx="6" fill="url(#dimScreen)"/>
      <path d="M168 640 h314 l-18 22 h-278 z" fill="url(#aluminiumShaded)"/>
      <rect x="294" y="640" width="58" height="7" rx="3.5" fill="#56627C"/>
    </g>

    <!-- Focus arc, passing behind the monitor -->
    <path d="M325 448 C 345 268, 600 222, 700 344" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"/>

    <!-- Monitor, right, in focus -->
    <rect x="538" y="352" width="300" height="210" rx="22" fill="url(#litScreen)" filter="url(#screenGlow)" opacity=".75"/>
    <g filter="url(#deviceShadow)">
      <rect x="530" y="344" width="316" height="226" rx="22" fill="#0E1638" stroke="url(#aluminium)" stroke-width="8"/>
      <rect x="548" y="362" width="280" height="190" rx="10" fill="url(#litScreen)"/>
      <path d="M664 574 h48 l12 76 h-72 z" fill="url(#aluminiumShaded)"/>
      <rect x="616" y="646" width="144" height="16" rx="8" fill="url(#aluminium)"/>
    </g>

    <!-- A window on the lit screen, and the focus ring -->
    <rect x="572" y="386" width="132" height="86" rx="8" fill="#fff" opacity=".35"/>
    <rect x="572" y="386" width="132" height="16" rx="8" fill="#fff" opacity=".55"/>
    <circle cx="742" cy="470" r="44" fill="none" stroke="#fff" stroke-width="10" opacity=".95"/>
    <circle cx="742" cy="470" r="15" fill="#fff"/>
  </g>
</svg>
